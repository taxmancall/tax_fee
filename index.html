<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원제우세무사사무소 | 재산분야 수수료 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --navy: #0d1f3c;
    --navy-mid: #1a3160;
    --gold: #c8972a;
    --gold-light: #e8b84b;
    --gold-pale: #fdf6e3;
    --white: #ffffff;
    --gray-100: #f7f8fa;
    --gray-200: #eaecf0;
    --gray-400: #9aa0aa;
    --gray-700: #3a3f4a;
    --red: #c0392b;
    --green: #1a6e4a;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(13,31,60,0.10);
    --shadow-lg: 0 8px 40px rgba(13,31,60,0.16);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--gray-100);
    color: var(--gray-700);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--navy);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      -55deg,
      transparent,
      transparent 60px,
      rgba(200,151,42,0.04) 60px,
      rgba(200,151,42,0.04) 61px
    );
  }
  .header-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 24px 28px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
  }
  .logo-badge {
    width: 56px;
    height: 56px;
    background: var(--gold);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(200,151,42,0.35);
  }
  .logo-badge svg { width: 32px; height: 32px; }
  .header-text { flex: 1; }
  .office-name {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.3px;
    line-height: 1.3;
  }
  .office-sub {
    font-size: 12px;
    color: var(--gold-light);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .year-badge {
    background: rgba(200,151,42,0.18);
    border: 1px solid rgba(200,151,42,0.35);
    color: var(--gold-light);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  /* MAIN */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  .card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
    margin-bottom: 20px;
  }

  .card-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::before {
    content: '';
    width: 3px;
    height: 16px;
    background: var(--gold);
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* TYPE SELECT */
  .type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .type-btn {
    border: 2px solid var(--gray-200);
    background: var(--white);
    border-radius: 10px;
    padding: 18px 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s;
    font-family: 'Noto Serif KR', serif;
  }
  .type-btn .type-icon { font-size: 28px; display: block; margin-bottom: 8px; }
  .type-btn .type-label {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    display: block;
  }
  .type-btn .type-desc {
    font-size: 11px;
    color: var(--gray-400);
    margin-top: 4px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
  }
  .type-btn:hover { border-color: var(--gold); background: var(--gold-pale); }
  .type-btn.active {
    border-color: var(--gold);
    background: var(--gold-pale);
    box-shadow: 0 0 0 3px rgba(200,151,42,0.15);
  }
  .type-btn.active .type-label { color: var(--gold); }

  /* MODE */
  .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .mode-btn {
    border: 2px solid var(--gray-200); background: var(--white); border-radius: 10px;
    padding: 12px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px; font-weight: 600; color: var(--gray-700); transition: all 0.18s;
  }
  .mode-btn small { display: block; font-size: 11px; font-weight: 300; color: var(--gray-400); margin-top: 2px; }
  .mode-btn.active { border-color: var(--navy); background: var(--navy); color: var(--white); }
  .mode-btn.active small { color: var(--gold-light); }
  .consult-select {
    width: 100%; border: 1.5px solid var(--gray-200); border-radius: 8px; padding: 13px 16px;
    font-family: 'Noto Sans KR', sans-serif; font-size: 15px; font-weight: 500; color: var(--navy);
    background: var(--white); outline: none;
  }
  .consult-info { font-size: 12px; color: var(--gray-400); margin-top: 8px; line-height: 1.6; }

  /* INPUTS */
  .input-group { margin-bottom: 18px; }
  .input-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 8px;
    display: block;
  }
  .input-label span {
    font-size: 11px;
    color: var(--gray-400);
    font-weight: 400;
    margin-left: 6px;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.15s;
    background: var(--white);
  }
  .input-row:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(200,151,42,0.12); }
  .input-row input {
    flex: 1;
    border: none;
    outline: none;
    padding: 13px 16px;
    font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
    color: var(--navy);
    background: transparent;
    text-align: right;
  }
  .input-unit {
    padding: 0 16px 0 0;
    font-size: 13px;
    color: var(--gray-400);
    white-space: nowrap;
  }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* ADJUST ROW */
  .adj-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .adj-row select {
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 12px 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--navy);
    background: var(--white);
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s;
  }
  .adj-row select:focus { border-color: var(--gold); }
  .adj-row .input-row { flex: 1; }

  /* JOINT */
  .joint-check {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px solid var(--gray-200); border-radius: 8px;
    padding: 12px 16px; font-size: 13px; color: var(--gray-700); cursor: pointer;
  }
  .joint-check input { width: 18px; height: 18px; accent-color: var(--gold); flex-shrink: 0; }
  .joint-check b { color: var(--navy); }

  .opt-list { display: flex; flex-direction: column; gap: 8px; }
  .opt-row { display: flex; gap: 8px; align-items: stretch; }
  .opt-row .joint-check { flex: 1; }
  .owners-wrap {
    display: flex; align-items: center; gap: 6px; padding: 0 12px;
    border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 13px; color: var(--gray-400);
  }
  .owners-wrap input {
    width: 48px; border: none; outline: none; text-align: right;
    font-size: 15px; font-weight: 500; color: var(--navy); font-family: 'Noto Sans KR', sans-serif;
  }

  /* NOTE */
  .note-area textarea {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: var(--gray-700);
    resize: vertical;
    min-height: 70px;
    outline: none;
    transition: border-color 0.15s;
  }
  .note-area textarea:focus { border-color: var(--gold); }
  .note-area textarea::placeholder { color: var(--gray-400); }

  /* CALC BTN */
  .calc-btn {
    width: 100%;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 10px;
    padding: 17px;
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }
  .calc-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--gold);
  }
  .calc-btn:hover { background: var(--navy-mid); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
  .calc-btn:active { transform: translateY(0); }

  /* RESULT */
  #result-card { display: none; }
  #result-card.show { display: block; animation: fadeUp 0.3s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    background: var(--navy);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  .result-header::after {
    content: '';
    position: absolute;
    right: -20px; top: -20px;
    width: 120px; height: 120px;
    background: rgba(200,151,42,0.08);
    border-radius: 50%;
  }
  .result-label {
    font-size: 12px;
    color: var(--gold-light);
    letter-spacing: 1px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .result-amount {
    font-family: 'Noto Serif KR', serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -1px;
  }
  .result-amount span { font-size: 18px; font-weight: 400; margin-left: 4px; }

  .breakdown-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .breakdown-table tr { border-bottom: 1px solid var(--gray-200); }
  .breakdown-table tr:last-child { border-bottom: none; }
  .breakdown-table td {
    padding: 11px 4px;
    color: var(--gray-700);
  }
  .breakdown-table td:last-child {
    text-align: right;
    font-weight: 600;
    color: var(--navy);
    font-variant-numeric: tabular-nums;
  }
  .breakdown-table tr.total td {
    padding-top: 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    border-top: 2px solid var(--navy);
  }
  .breakdown-table tr.discount td { color: var(--red); }
  .breakdown-table tr.discount td:last-child { color: var(--red); }

  /* BANK BOX */
  .bank-box {
    background: linear-gradient(135deg, var(--gold-pale), #fffbf0);
    border: 1.5px solid rgba(200,151,42,0.3);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .bank-icon {
    width: 44px;
    height: 44px;
    background: var(--gold);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 22px;
  }
  .bank-info { flex: 1; }
  .bank-label { font-size: 11px; color: var(--gray-400); font-weight: 400; margin-bottom: 4px; }
  .bank-account {
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.5px;
  }
  .bank-account span { color: var(--gold); }
  .bank-note { font-size: 11px; color: var(--gray-400); margin-top: 3px; }

  /* PDF BTN */
  .pdf-btn {
    width: 100%;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    margin-top: 16px;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .pdf-btn:hover { background: var(--gold-light); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(200,151,42,0.3); }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--gray-400);
  }

  /* AMOUNT PREVIEW */
  .amount-preview {
    font-size: 12px;
    color: var(--gold);
    text-align: right;
    margin-top: 5px;
    font-weight: 500;
    min-height: 18px;
  }

  @media (max-width: 480px) {
    .two-col { grid-template-columns: 1fr; }
    .type-grid { grid-template-columns: 1fr; gap: 8px; }
    .type-btn { padding: 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
    .type-btn .type-icon { font-size: 22px; margin-bottom: 0; }
    .result-amount { font-size: 28px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-badge">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8h24M4 16h16M4 24h20" stroke="#0d1f3c" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="26" cy="22" r="5" fill="#0d1f3c" opacity="0.85"/>
        <path d="M24 22l1.5 1.5L28 20" stroke="#c8972a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="header-text">
      <div class="office-name">원제우세무사사무소</div>
      <div class="office-sub">재산분야 수수료 계산기 · 상속 · 증여 · 양도</div>
    </div>
    <div class="year-badge" id="year-badge">2026년 기준</div>
  </div>
</header>

<main>

  <!-- 세금 유형 -->
  <div class="card">
    <div class="card-title">세금 유형 선택</div>
    <div class="type-grid">
      <button class="type-btn active" data-type="상속" onclick="selectType(this)">
        <span class="type-icon">🏛</span>
        <span class="type-label">상속세</span>
        <span class="type-desc">상속재산 신고대리</span>
      </button>
      <button class="type-btn" data-type="증여" onclick="selectType(this)">
        <span class="type-icon">🎁</span>
        <span class="type-label">증여세</span>
        <span class="type-desc">증여재산 신고대리</span>
      </button>
      <button class="type-btn" data-type="양도" onclick="selectType(this)">
        <span class="type-icon">🏠</span>
        <span class="type-label">양도소득세</span>
        <span class="type-desc">부동산 양도 신고대리</span>
      </button>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="신고" onclick="selectMode(this)">신고대리<small>재산·거래금액 기준</small></button>
      <button class="mode-btn" data-mode="상담" onclick="selectMode(this)">상담<small>시간 기준</small></button>
    </div>
  </div>

  <!-- 금액 입력 -->
  <div class="card">
    <div class="card-title" id="input-title">거래금액 입력</div>

    <!-- 상담 (시간 기준) -->
    <div class="input-group" id="consult-group" style="display:none">
      <label class="input-label">상담 시간 <span>방문·화상 상담 기준</span></label>
      <select class="consult-select" id="consult-time">
        <option value="0">1시간 (기본)</option>
        <option value="1">1시간 30분</option>
        <option value="2">2시간</option>
        <option value="3">2시간 30분</option>
        <option value="4">3시간</option>
      </select>
      <div class="consult-info" id="consult-info"></div>
    </div>

    <div class="input-group" id="amount-group">
      <label class="input-label" id="amount-label">수입(자산)금액 <span>원 단위 입력</span></label>
      <div class="input-row">
        <input type="text" id="amount" placeholder="0" oninput="formatAmount(this)" onkeyup="updatePreview()">
        <span class="input-unit">원</span>
      </div>
      <div class="amount-preview" id="amount-preview"></div>
    </div>

    <!-- 기장 고객 할인 -->
    <div class="input-group">
      <label class="joint-check"><input type="checkbox" id="bookkeeping"><span><b>기장 고객</b> · <span id="book-desc"></span></span></label>
    </div>

    <!-- 할인 / 가산 -->
    <div class="two-col">
      <div class="input-group">
        <label class="input-label">할인 <span>기준 수수료 대비</span></label>
        <div class="adj-row">
          <div class="input-row">
            <input type="number" id="discount" placeholder="0" min="0" max="100" step="1" oninput="clampAdj(this)">
            <span class="input-unit">%</span>
          </div>
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">가산 <span>기준 수수료 대비</span></label>
        <div class="adj-row">
          <div class="input-row">
            <input type="number" id="surcharge" placeholder="0" min="0" max="200" step="1" oninput="clampAdj(this)">
            <span class="input-unit">%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 추가 검토 항목 (양도 전용) -->
    <div class="input-group" id="joint-group" style="display:none">
      <label class="input-label">추가 검토 항목 <span>해당 항목 체크 시 수수료 가산 · 부가세 포함</span></label>
      <div class="opt-list">
        <div class="opt-row">
          <label class="joint-check"><input type="checkbox" id="opt-joint" onchange="toggleOwners()"><span><b>공동명의</b> · 기준 수수료에 추가 1인당 +30%</span></label>
          <div class="owners-wrap" id="owners-wrap" style="display:none">
            <input type="number" id="owners" value="2" min="2" max="20" step="1" onchange="clampOwners(this)"><span>명</span>
          </div>
        </div>
        <label class="joint-check"><input type="checkbox" class="opt" data-label="자본적지출 검토" data-fee="110000"><span><b>자본적지출 검토</b> · +110,000원</span></label>
        <label class="joint-check"><input type="checkbox" class="opt" data-label="비과세 검토" data-fee="220000"><span><b>비과세 검토</b> · +220,000원</span></label>
        <label class="joint-check"><input type="checkbox" class="opt" data-label="감면 검토" data-fee="330000"><span><b>감면 검토</b> · +330,000원</span></label>
        <label class="joint-check"><input type="checkbox" class="opt" data-label="1년 단위 합산" data-fee="110000"><span><b>1년 단위 합산</b> · 같은 해 다른 양도분 합산신고 · +110,000원</span></label>
      </div>
    </div>

    <!-- 비고 -->
    <div class="input-group note-area">
      <label class="input-label">비고 <span>메모 (PDF에 포함됩니다)</span></label>
      <textarea id="note" placeholder="예) 공동상속인 3명, 부동산 2건 포함 등"></textarea>
    </div>

    <button class="calc-btn" onclick="calculate()">수수료 계산하기</button>
  </div>

  <!-- 결과 -->
  <div class="card" id="result-card">
    <div class="card-title">수수료 산출 결과</div>

    <div class="result-header">
      <div class="result-label" id="res-type-label">상속세 신고대리 수수료</div>
      <div class="result-amount" id="res-final-amount">0<span>원</span></div>
    </div>

    <table class="breakdown-table" id="breakdown-table">
    </table>

    <div style="height:20px"></div>

    <!-- 입금 계좌 -->

<script>
  let selectedType = '상속';
  let selectedMode = '신고';

  // 상담료 (부가세 포함): 기본 1시간 + 추가 30분당
  const CONSULT = {
    '상속': { base: 220000, extra: 55000 },
    '증여': { base: 110000, extra: 55000 },
    '양도': { base: 110000, extra: 55000 }
  };

  // 기장 고객 할인: 기준 수수료에만 적용 (공동명의 가산·추가 검토 항목 제외)
  const BOOK_RATE = { '상속': 30, '증여': 30, '양도': 50 };
  const BOOK_CAP = { '상속': 2200000, '증여': 2200000 }; // 할인 상한 (부가세 포함), 양도는 상한 없음

  function selectMode(btn) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedMode = btn.dataset.mode;
    updateAmountLabel();
  }
  let lastResult = null;

  function selectType(btn) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
    updateAmountLabel();
    updatePreview();
  }

  function updateAmountLabel() {
    const labels = { '상속': '상속재산 가액', '증여': '증여재산 가액', '양도': '양도 거래금액' };
    document.getElementById('amount-label').innerHTML = `${labels[selectedType]} <span>원 단위 입력</span>`;
    const consult = selectedMode === '상담';
    const showOpts = selectedType === '양도' && !consult;
    document.getElementById('input-title').textContent = consult ? '상담 시간 입력' : '거래금액 입력';
    document.getElementById('consult-group').style.display = consult ? '' : 'none';
    document.getElementById('amount-group').style.display = consult ? 'none' : '';
    document.getElementById('joint-group').style.display = showOpts ? '' : 'none';
    if (!showOpts) resetOptions();
    const cap = BOOK_CAP[selectedType];
    document.getElementById('book-desc').textContent = consult
      ? '기본 1시간 상담료 면제'
      : `기준 수수료 ${BOOK_RATE[selectedType]}% 할인` + (cap ? ` (상한 ${(cap / 10000).toLocaleString('ko-KR')}만원)` : '');
    const c = CONSULT[selectedType];
    document.getElementById('consult-info').innerHTML =
      `${selectedType}${selectedType === '양도' ? '소득' : ''}세 상담료: 기본 1시간 ${c.base.toLocaleString('ko-KR')}원 · 추가 30분당 ${c.extra.toLocaleString('ko-KR')}원 (부가세 포함)<br>상담 후 신고를 위임하시면 상담료 전액을 신고 수수료에서 차감합니다.`;
  }

  function formatAmount(el) {
    let raw = el.value.replace(/[^0-9]/g, '');
    if (raw === '') { el.value = ''; updatePreview(); return; }
    el.value = Number(raw).toLocaleString('ko-KR');
    updatePreview();
  }

  function getRawAmount() {
    return parseInt(document.getElementById('amount').value.replace(/,/g, '') || '0');
  }

  function updatePreview() {
    const amt = getRawAmount();
    const el = document.getElementById('amount-preview');
    if (!amt) { el.textContent = ''; return; }
    el.textContent = formatKorean(amt);
  }

  function formatKorean(n) {
    const units = ['', '만', '억', '조'];
    const parts = [];
    let tmp = n;
    const div = [1, 10000, 100000000, 1000000000000];
    for (let i = div.length - 1; i >= 0; i--) {
      const val = Math.floor(tmp / div[i]);
      if (val > 0) { parts.push(val.toLocaleString('ko-KR') + units[i]); }
      tmp = tmp % div[i];
    }
    return parts.join(' ') + '원';
  }

  function clampOwners(el) {
    let n = Math.floor(Number(el.value));
    if (!(n >= 2)) n = 2;
    if (n > 20) n = 20;
    el.value = n;
  }

  function toggleOwners() {
    document.getElementById('owners-wrap').style.display = document.getElementById('opt-joint').checked ? '' : 'none';
  }

  function resetOptions() {
    document.querySelectorAll('#joint-group input[type=checkbox]').forEach(c => c.checked = false);
    document.getElementById('owners').value = 2;
    toggleOwners();
  }

  function clampAdj(el) {
    if (el.value < 0) el.value = 0;
  }

  // ── 수수료 테이블 ──
  function calcBase(type, amount) {
    if (type === '상속') {
      // 2026.9. 채택 기준표 (부가세 별도 설계) → 이 페이지는 부가세 포함 표시이므로 ×1.1
      const EOK = 100000000;
      let supply;
      if (amount <= 3 * EOK) supply = 1500000;
      else if (amount <= 5 * EOK) supply = 2000000;
      else if (amount <= 10 * EOK) supply = 2500000;
      else if (amount < 20 * EOK) supply = 2500000 + (amount - 10 * EOK) * 0.003;
      else if (amount < 30 * EOK) supply = 5500000 + (amount - 20 * EOK) * 0.002;
      else if (amount < 50 * EOK) supply = 7500000 + (amount - 30 * EOK) * 0.0015;
      else if (amount < 100 * EOK) supply = 10500000 + (amount - 50 * EOK) * 0.001;
      else supply = 15500000; // 100억원 이상: 기준선, 초과분 별도 협의
      return supply * 1.1;
    }
    if (type === '증여') {
      if (amount < 200000000) return 550000;
      if (amount < 500000000) return 550000 + (amount - 200000000) * 3.3 / 1000;
      if (amount < 1000000000) return 1320000 + (amount - 500000000) * 2.75 / 1000;
      if (amount < 3000000000) return 2695000 + (amount - 1000000000) * 2.2 / 1000;
      if (amount < 5000000000) return 7095000 + (amount - 3000000000) * 1.65 / 1000;
      if (amount < 10000000000) return 10395000 + (amount - 5000000000) * 0.55 / 1000;
      return 13145000 + (amount - 10000000000) * 0.275 / 1000;
    }
    if (type === '양도') {
      if (amount < 200000000) return 330000;
      if (amount < 1000000000) return 330000 + (amount - 200000000) * 0.0011;
      return 1320000 + (amount - 1000000000) * 0.00055;
    }
    return 0;
  }

  function calculate() {
    const consult = selectedMode === '상담';
    const amount = consult ? 0 : getRawAmount();
    if (!consult && (!amount || amount <= 0)) {
      alert('금액을 입력해 주세요.');
      return;
    }
    const steps = consult ? Number(document.getElementById('consult-time').value) : 0;
    const minutes = 60 + steps * 30;
    const timeLabel = Math.floor(minutes / 60) + '시간' + (minutes % 60 ? ' 30분' : '');
    const discount = parseFloat(document.getElementById('discount').value || 0);
    const surcharge = parseFloat(document.getElementById('surcharge').value || 0);
    const note = document.getElementById('note').value.trim();

    const base = consult ? CONSULT[selectedType].base + steps * CONSULT[selectedType].extra : Math.round(calcBase(selectedType, amount));
    const JOINT_RATE = 30; // 공동명의 가산율(%): 명의자 추가 1인당
    const isYangdo = selectedType === '양도' && !consult;
    const joint = isYangdo && document.getElementById('opt-joint').checked;
    const owners = joint ? Math.min(20, Math.max(2, Math.floor(Number(document.getElementById('owners').value) || 2))) : 1;
    const jointRate = JOINT_RATE * (owners - 1);
    const jointAmt = joint ? Math.round(base * jointRate / 100) : 0;
    const surchargeAmt = Math.round(base * surcharge / 100);
    // 양도 추가 검토 항목 (정액, 부가세 포함)
    const extras = isYangdo ? Array.from(document.querySelectorAll('#joint-group .opt:checked')).map(c => [c.dataset.label, Number(c.dataset.fee)]) : [];
    const extrasAmt = extras.reduce((t, e) => t + e[1], 0);
    const afterSurcharge = base + jointAmt + extrasAmt + surchargeAmt;
    // 기장 고객 할인
    const book = document.getElementById('bookkeeping').checked;
    let bookAmt = 0, bookLabel = '';
    if (book && consult) {
      bookAmt = CONSULT[selectedType].base;
      bookLabel = '기장 고객 할인 (기본 1시간 면제)';
    } else if (book) {
      const rate = BOOK_RATE[selectedType], cap = BOOK_CAP[selectedType];
      bookAmt = Math.round(base * rate / 100);
      const capped = cap && bookAmt > cap;
      if (capped) bookAmt = cap;
      bookLabel = `기장 고객 할인 (${rate}%${capped ? ' · 상한 적용' : ''})`;
    }
    const afterBook = afterSurcharge - bookAmt;
    const discountAmt = Math.round(afterBook * discount / 100);
    const final = afterBook - discountAmt;

    lastResult = { type: selectedType, consult, timeLabel, amount, base, joint, owners, jointAmt, jointRate, extras, book, bookAmt, bookLabel, surcharge, surchargeAmt, discount, discountAmt, final, note };

    // 화면 출력
    const feeWord = consult ? '상담료' : '수수료';
    document.getElementById('res-type-label').textContent = `${selectedType}세 ${consult ? '상담료' : '신고대리 수수료'} (부가세 포함)`;
    document.getElementById('res-final-amount').innerHTML = `${final.toLocaleString('ko-KR')}<span>원</span>`;

    const rows = [];
    rows.push(consult ? ['상담 시간', timeLabel] : ['거래금액', formatKorean(amount)]);
    rows.push(['기준 ' + feeWord, base.toLocaleString('ko-KR') + ' 원']);
    if (joint) rows.push(['공동명의 가산 (' + owners + '명 · ' + jointRate + '%)', '+' + jointAmt.toLocaleString('ko-KR') + ' 원', 'surcharge']);
    extras.forEach(e => rows.push([e[0], '+' + e[1].toLocaleString('ko-KR') + ' 원', 'surcharge']));
    if (surcharge > 0) rows.push(['가산 (' + surcharge + '%)', '+' + surchargeAmt.toLocaleString('ko-KR') + ' 원', 'surcharge']);
    if (book) rows.push([bookLabel, '-' + bookAmt.toLocaleString('ko-KR') + ' 원', 'discount']);
    if (discount > 0) rows.push(['할인 (' + discount + '%)', '-' + discountAmt.toLocaleString('ko-KR') + ' 원', 'discount']);
    rows.push(['최종 ' + feeWord + ' (부가세 포함)', final.toLocaleString('ko-KR') + ' 원', 'total']);
    if (consult) rows.push(['신고 위임 시', '상담료 전액을 신고 수수료에서 차감']);
    if (!consult && selectedType === '상속' && amount >= 10000000000) rows.push(['100억원 초과분', '별도 협의 (위 금액은 기준선)']);
    if (note) rows.push(['비고', note]);

    lastResult.rows = rows;
    lastResult.feeWord = feeWord;

    const table = document.getElementById('breakdown-table');
    table.innerHTML = rows.map(r => {
      const cls = r[2] ? ` class="${r[2]}"` : '';
      return `<tr${cls}><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`;
    }).join('');

    const rc = document.getElementById('result-card');
    rc.classList.add('show');
    rc.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── PDF 생성 ──
  // 한글이 깨지지 않도록 안내서를 화면용 글꼴로 그린 뒤 이미지로 PDF에 넣는다.
  function esc(t) {
    return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function downloadPDF() {
    if (!lastResult) { alert('먼저 수수료를 계산해 주세요.'); return; }
    if (!window.jspdf || !window.html2canvas) { alert('PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'); return; }

    const r = lastResult;
    const today = new Date();
    const dateStr = `${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
    const taxName = { '상속': '상속세', '증여': '증여세', '양도': '양도소득세' }[r.type];
    const title = `${taxName} ${r.consult ? '상담료' : '신고대리 수수료'} 안내서`;
    const amountLabel = r.consult ? '상담 시간' : { '상속': '상속재산 가액', '증여': '증여재산 가액', '양도': '양도 거래금액' }[r.type];
    const amountText = r.consult ? r.timeLabel : r.amount.toLocaleString('ko-KR') + '원';
    const amountSub = r.consult ? '' : formatKorean(r.amount);

    // 첫 행(거래금액/상담 시간)과 비고는 별도 영역에 표시
    const body = r.rows.slice(1).filter(x => x[0] !== '비고' && x[2] !== 'total');
    const total = r.rows.find(x => x[2] === 'total');
    const bodyHtml = body.map((x, i) => {
      const color = x[2] === 'discount' ? '#c0392b' : '#0d1f3c';
      return `<tr style="background:${i % 2 ? '#f5f7fc' : '#fafcff'}"><td style="padding:11px 20px;color:#3a3f4a">${esc(x[0])}</td><td style="padding:11px 20px;text-align:right;font-weight:600;color:${color}">${esc(x[1])}</td></tr>`;
    }).join('');

    const sheet = document.createElement('div');
    sheet.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;height:1123px;background:#fff;font-family:'Noto Sans KR',sans-serif;color:#3a3f4a;display:flex;flex-direction:column;";
    sheet.innerHTML = `
      <div style="background:#0d1f3c;padding:34px 48px 28px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:8px solid #c8972a">
        <div>
          <div style="font-family:'Noto Serif KR',serif;font-size:26px;font-weight:700;color:#fff">원제우세무사사무소</div>
          <div style="font-size:13px;color:#e8b84b;margin-top:6px">재산분야 수수료 안내 · 2026년 기준</div>
        </div>
        <div style="text-align:right;font-size:12px;color:#c8ccd4">발행일<br><span style="font-size:15px;color:#fff;font-weight:500">${dateStr}</span></div>
      </div>
      <div style="padding:34px 48px 0;flex:1">
        <div style="background:#f0f2f5;border-radius:8px;padding:16px;text-align:center">
          <div style="font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:#0d1f3c">${title}</div>
          <div style="font-size:12px;color:#646e82;margin-top:4px">부가가치세 포함</div>
        </div>
        <div style="background:#0d1f3c;border-radius:8px;padding:18px 24px;margin-top:20px">
          <div style="font-size:12px;color:#e8b84b">${amountLabel}</div>
          <div style="font-size:24px;font-weight:600;color:#fff;margin-top:4px">${amountText}${amountSub ? `<span style="font-size:13px;font-weight:400;color:#c8ccd4;margin-left:10px">${amountSub}</span>` : ''}</div>
        </div>
        <table style="width:100%;border-collapse:collapse;margin-top:24px;font-size:14px">
          <tr style="background:#0d1f3c;color:#fff"><th style="padding:10px 20px;text-align:left;font-weight:600">항목</th><th style="padding:10px 20px;text-align:right;font-weight:600">금액</th></tr>
          ${bodyHtml}
          <tr style="background:#c8972a;color:#0d1f3c;font-weight:700;font-size:16px"><td style="padding:14px 20px">${esc(total[0])}</td><td style="padding:14px 20px;text-align:right">${esc(total[1])}</td></tr>
        </table>
        ${r.note ? `<div style="margin-top:20px;border:1px solid #c8972a;background:#fffbeb;border-radius:8px;padding:14px 20px;font-size:13px;line-height:1.6"><b style="color:#c8972a;margin-right:10px">비고</b><span style="white-space:pre-wrap">${esc(r.note)}</span></div>` : ''}
        <div style="margin-top:20px;border:1px solid #c8d7eb;background:#f8fcff;border-radius:8px;padding:16px 24px">
          <div style="font-size:12px;font-weight:600;color:#0d1f3c">수수료 입금 계좌 안내</div>
          <div style="font-size:18px;font-weight:700;color:#c8972a;margin-top:6px">하나은행 010-3489-4567</div>
          <div style="font-size:12px;color:#646e82;margin-top:4px">(평생계좌) 예금주: 원제우</div>
        </div>
        <div style="margin-top:20px;background:#f0f2f5;border-radius:8px;padding:14px 20px;font-size:12px;line-height:1.8;color:#646e82">
          <b style="color:#0d1f3c">유의사항</b><br>
          · 위 금액은 부가가치세 포함 금액입니다.<br>
          · 세무조사 수수료는 별도로 산정됩니다. 수수료는 매년 변동될 수 있습니다.
        </div>
      </div>
      <div style="background:#0d1f3c;border-top:4px solid #c8972a;padding:14px 48px;text-align:center;font-size:11.5px;color:#c8ccd4">
        원제우세무사사무소 · 부천시 소향로 135 3층 · 전화 032-321-4521 · taxmancall@gmail.com
      </div>`;
    document.body.appendChild(sheet);

    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
      doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
      doc.save(`원제우세무사사무소_${taxName}_${r.consult ? '상담료' : '수수료'}_${dateStr}.pdf`);
    } catch (e) {
      alert('PDF 저장 중 오류가 발생했습니다. 다시 시도해 주세요.');
      console.error(e);
    } finally {
      sheet.remove();
    }
  }

  // 초기화
  updateAmountLabel();
</script>
